<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xavinsky GitHub Pages</title>
<style>
  :root{
    --bg:#ffffff; --fg:#1a1a1a; --muted:#5a5a5a; --accent:#3b6fd6; --border:#e2e2e2;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#161616; --fg:#eaeaea; --muted:#a0a0a0; --accent:#7aa2f7; --border:#333; }
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    background:var(--bg); color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding:2rem;
  }
  main{ max-width:32rem; }
  h1{ font-size:1.6rem; margin:0 0 1.5rem; }
  ul{ list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:.75rem; }
  li{ display:flex; gap:.5rem; }
  a{
    color:var(--accent); text-decoration:none; font-weight:600;
    border:1px solid var(--border); border-radius:.5rem;
    padding:.75rem 1rem;
    transition:border-color .15s;
  }
  a.item{ flex:1; }
  a.gh{ color:var(--muted); flex:0 0 auto; }
  a:hover{ border-color:var(--accent); color:var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Xavinsky GitHub Pages</h1>
  <ul>
    <li>
      <a class="item" href="/memoria/">Mémo Data Science &amp; IA</a>
      <a class="gh" href="https://github.com/xavinsky/memoria" title="Voir le repo GitHub">src</a>
    </li>
  </ul>
</main>
</body>
</html>
