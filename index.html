<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xavier Manach</title>
<style>
  :root{
    --bg:#ffffff; --fg:#1a1a1a; --muted:#5a5a5a; --accent:#3b6fd6; --border:#e2e2e2;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#161616; --fg:#eaeaea; --muted:#a0a0a0; --accent:#7aa2f7; --border:#333; }
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--bg); color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding:2rem;
  }
  main{ max-width:32rem; }
  h1{ font-size:1.6rem; margin:0 0 .5rem; }
  p{ color:var(--muted); line-height:1.5; margin:0 0 1.5rem; }
  ul{ list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:.75rem; }
  a{
    color:var(--accent); text-decoration:none; font-weight:600;
    border:1px solid var(--border); border-radius:.5rem;
    padding:.75rem 1rem; display:flex; justify-content:space-between; align-items:center;
    transition:border-color .15s;
  }
  a:hover{ border-color:var(--accent); }
  a small{ color:var(--muted); font-weight:400; }
</style>
</head>
<body>
<main>
  <h1>Xavier Manach</h1>
  <p>Quelques projets en ligne.</p>
  <ul>
    <li><a href="/memo/">Mémo Data Science / IA <small>syntaxes &amp; formules</small></a></li>
  </ul>
</main>
</body>
</html>
